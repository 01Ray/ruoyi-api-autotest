[pytest]
# 测试文件搜索路径
testpaths = api_tests/cases

# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# 自定义标记
markers =
    smoke: 冒烟测试 - 最核心的功能验证
    regression: 回归测试 - 全量
    login: 登录模块
    user: 用户模块
    role: 角色模块
    dict: 字典模块